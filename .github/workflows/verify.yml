name: Round 2 evidence export
on:
  workflow_dispatch:
    inputs:
      runs:
        description: JSON list of completed qualification run IDs
        required: true
permissions:
  actions: read
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        run: ${{ fromJSON(inputs.runs) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r2-receipts
          run-id: ${{ matrix.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: receipts
      - name: Export compact numeric evidence to job log
        env:
          QUALIFICATION_RUN: ${{ matrix.run }}
        run: |
          python - <<'PY'
          import json, os, base64, zlib, hashlib
          from pathlib import Path
          run = os.environ['QUALIFICATION_RUN']
          for path in Path('receipts').rglob('*.json'):
              rows = json.loads(path.read_text())
              if path.name.startswith('memory'):
                  rows = [{k:v for k,v in row.items() if k != 'stat'} | {'end_anon':row['stat']['anon'], 'end_file':row['stat']['file']} for row in rows]
              print('RECEIPT '+json.dumps({'run':run, 'file':path.name, 'rows':rows}), flush=True)
          PY
          for path in Path('receipts').rglob('*.s'):
              payload = base64.b64encode(zlib.compress(path.read_bytes())).decode()
              chunks = [payload[i:i+32768] for i in range(0, len(payload), 32768)]
              for i, chunk in enumerate(chunks):
                  print('CODEGEN '+json.dumps({'run':run, 'file':path.name, 'part':i, 'total':len(chunks), 'sha256':hashlib.sha256(path.read_bytes()).hexdigest(), 'data':chunk}), flush=True)
