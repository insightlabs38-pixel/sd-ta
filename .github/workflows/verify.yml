name: Track A exactness
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile baseline
        run: g++ -O3 -march=x86-64-v3 -std=c++20 -DNDEBUG -pthread -static-libstdc++ -static-libgcc -o solution track-a/main.cpp
      - name: Differential synthetic tests
        run: python tests/synthetic.py "$PWD/solution"
      - name: Verify official seed-1 tiny, sample and full hashes
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/organizer
          mkdir -p /tmp/a-out
          for scale in tiny sample full; do
            mkdir -p "/tmp/a-$scale"
            python /tmp/organizer/generators/a_ingest.py --seed 1 --scale "$scale" --out "/tmp/a-$scale"
            SD_DATA_DIR="/tmp/a-$scale" SD_OUT_DIR=/tmp/a-out ./solution
            case "$scale" in
              tiny) expected=c24fa507c963eaeac9224fd8435019b4f4e8c002ece7e32f316681a3957eb92f ;;
              sample) expected=ca6311bbeb536fa55d85265bf6fd3d24cc9586f13de1ac73bd2a23ac3893aac3 ;;
              full) expected=495ca09682b9673ef836a506496177680bb4a3af54255174befddb1f83481cd3 ;;
            esac
            echo "$expected  /tmp/a-out/summary.txt" | sha256sum -c -
          done
      - name: Holdout-like seed-2 and seed-3 sample differential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a-seed2 /tmp/a-ref
          for seed in 2 3; do
            mkdir -p "/tmp/a-seed$seed"
            python /tmp/organizer/generators/a_ingest.py --seed "$seed" --scale sample --out "/tmp/a-seed$seed"
            python /tmp/organizer/reference/a_ingest.py --data "/tmp/a-seed$seed" --out /tmp/a-ref
            SD_DATA_DIR="/tmp/a-seed$seed" SD_OUT_DIR=/tmp/a-out ./solution
            cmp /tmp/a-out/summary.txt /tmp/a-ref/summary.txt
          done
      - name: Compare full-input end-to-end runtime with verified champion
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 0c861331cf8ac4493d1e848a8c459cb8209db789
          git show 0c861331cf8ac4493d1e848a8c459cb8209db789:track-a/main.cpp > /tmp/a-prev.cpp
          g++ -O3 -std=c++20 -DNDEBUG -pthread -static-libstdc++ -static-libgcc -o /tmp/a-prev /tmp/a-prev.cpp
          g++ -O3 -march=x86-64-v3 -std=c++20 -DNDEBUG -pthread -static-libstdc++ -static-libgcc -o /tmp/a-prev-v3 /tmp/a-prev.cpp
          git fetch --depth=1 origin bcbe7b64c540bc8680284bd978865c423201966e
          git show bcbe7b64c540bc8680284bd978865c423201966e:track-a/main.cpp > /tmp/a-drop.cpp
          g++ -O3 -march=x86-64-v3 -std=c++20 -DNDEBUG -pthread -static-libstdc++ -static-libgcc -o /tmp/a-drop /tmp/a-drop.cpp
          python - <<'PY'
          import hashlib, os, random, statistics, subprocess, time
          env = dict(os.environ, SD_DATA_DIR='/tmp/a-full', SD_OUT_DIR='/tmp/a-out')
          expected = '495ca09682b9673ef836a506496177680bb4a3af54255174befddb1f83481cd3'
          binaries = {'champion': '/tmp/a-prev', 'champion-v3': '/tmp/a-prev-v3', 'drop': '/tmp/a-drop', 'candidate': './solution'}
          samples = {key: [] for key in binaries}
          rng = random.Random(20261030)
          for _ in range(31):
              order = list(binaries)
              rng.shuffle(order)
              for key in order:
                  start = time.perf_counter()
                  subprocess.run([binaries[key]], env=env, check=True)
                  samples[key].append(time.perf_counter() - start)
                  with open('/tmp/a-out/summary.txt', 'rb') as f:
                      assert hashlib.sha256(f.read()).hexdigest() == expected
          old = statistics.median(samples['champion-v3'])
          new = statistics.median(samples['candidate'])
          print(f'Full seed-1 31-run medians: champion-generic={statistics.median(samples["champion"]):.6f}s champion-v3={old:.6f}s sparse={statistics.median(samples["drop"]):.6f}s candidate={new:.6f}s ratio={new/old:.4f}', flush=True)
          PY
      - name: Compare full-input peak RSS
        shell: bash
        run: |
          set -euo pipefail
          SD_DATA_DIR=/tmp/a-full SD_OUT_DIR=/tmp/a-out /usr/bin/time -f 'champion RSS KiB=%M' -o /tmp/a-rss-prev /tmp/a-prev
          SD_DATA_DIR=/tmp/a-full SD_OUT_DIR=/tmp/a-out /usr/bin/time -f 'drop RSS KiB=%M' -o /tmp/a-rss-drop /tmp/a-drop
          SD_DATA_DIR=/tmp/a-full SD_OUT_DIR=/tmp/a-out /usr/bin/time -f 'candidate RSS KiB=%M' -o /tmp/a-rss-new ./solution
          cat /tmp/a-rss-prev /tmp/a-rss-drop /tmp/a-rss-new
      - name: Validate Docker allowlist and offline sandbox
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/organizer/harness/dockerfile_check.py track-a/Dockerfile /tmp/organizer/harness/allowlist.json
          docker pull gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce
          docker pull debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          docker build --network=none --pull=false -t sd-track-a -f track-a/Dockerfile track-a
          size=$(docker image inspect sd-track-a --format '{{.Size}}')
          test "$size" -lt 2000000000
          mkdir -p /tmp/a-container-out
          chmod 777 /tmp/a-container-out
          docker run --rm --network=none --read-only --memory=8g --memory-swap=8g --pids-limit=512 --tmpfs /tmp:rw,size=1g \
            --mount type=bind,source=/tmp/a-tiny,target=/data,readonly \
            --mount type=bind,source=/tmp/a-container-out,target=/out \
            sd-track-a
          echo 'c24fa507c963eaeac9224fd8435019b4f4e8c002ece7e32f316681a3957eb92f  /tmp/a-container-out/summary.txt' | sha256sum -c -
          docker run --rm --network=none --read-only --memory=8g --memory-swap=8g --pids-limit=512 --tmpfs /tmp:rw,size=1g \
            --mount type=bind,source=/tmp/a-full,target=/data,readonly \
            --mount type=bind,source=/tmp/a-container-out,target=/out \
            sd-track-a
          echo '495ca09682b9673ef836a506496177680bb4a3af54255174befddb1f83481cd3  /tmp/a-container-out/summary.txt' | sha256sum -c -

      - name: Compare scored-style cgroup memory peaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a-prev-image
          cp /tmp/a-prev.cpp /tmp/a-prev-image/main.cpp
          cp track-a/Dockerfile /tmp/a-prev-image/Dockerfile
          docker build --network=none --pull=false -t sd-track-a-prev -f /tmp/a-prev-image/Dockerfile /tmp/a-prev-image
          mkdir -p /tmp/a-drop-image
          cp /tmp/a-drop.cpp /tmp/a-drop-image/main.cpp
          cp track-a/Dockerfile /tmp/a-drop-image/Dockerfile
          docker build --network=none --pull=false -t sd-track-a-drop -f /tmp/a-drop-image/Dockerfile /tmp/a-drop-image
          for label in champion drop candidate; do
            image=sd-track-a-prev
            if [ "$label" = drop ]; then image=sd-track-a-drop; fi
            if [ "$label" = candidate ]; then image=sd-track-a; fi
            echo "Measuring $label cgroup memory.peak"
            docker run --rm --network=none --read-only --memory=8g --memory-swap=8g --pids-limit=512 --tmpfs /tmp:rw,size=1g \
              --mount type=bind,source=/tmp/a-full,target=/data,readonly \
              --mount type=bind,source=/tmp/a-container-out,target=/out \
              --entrypoint /bin/sh "$image" -c '/solution && cat /sys/fs/cgroup/memory.peak'
          done
