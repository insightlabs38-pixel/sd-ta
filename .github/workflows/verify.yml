name: Prize architecture qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile baseline
        run: g++ -O3 -march=x86-64-v3 -std=c++20 -DNDEBUG -pthread -static-libstdc++ -static-libgcc -o solution track-a/main.cpp
      - name: Differential synthetic tests
        run: python tests/synthetic.py "$PWD/solution"
      - name: Endpoint length differential
        run: |
          python tests/lengths.py "$PWD/solution"
          python tests/latencies.py "$PWD/solution"
          python tests/groups.py "$PWD/solution"
          python tests/sizes.py "$PWD/solution"
      - name: Deliberate fingerprint collisions
        run: python tests/identity.py "$PWD/solution"
      - name: Dense minimum-length record differential
        run: python tests/dense.py "$PWD/solution"
      - name: Verify official seed-1 tiny, sample and full hashes
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/organizer
          mkdir -p /tmp/a-out
          for scale in tiny sample full; do
            mkdir -p "/tmp/a-$scale"
            python /tmp/organizer/generators/a_ingest.py --seed 1 --scale "$scale" --out "/tmp/a-$scale"
            SD_DATA_DIR="/tmp/a-$scale" SD_OUT_DIR=/tmp/a-out ./solution
            case "$scale" in
              tiny) expected=c24fa507c963eaeac9224fd8435019b4f4e8c002ece7e32f316681a3957eb92f ;;
              sample) expected=ca6311bbeb536fa55d85265bf6fd3d24cc9586f13de1ac73bd2a23ac3893aac3 ;;
              full) expected=495ca09682b9673ef836a506496177680bb4a3af54255174befddb1f83481cd3 ;;
            esac
            echo "$expected  /tmp/a-out/summary.txt" | sha256sum -c -
          done
      - name: Holdout-like seed-2 and seed-3 sample differential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a-seed2 /tmp/a-ref
          for seed in 2 3; do
            mkdir -p "/tmp/a-seed$seed"
            python /tmp/organizer/generators/a_ingest.py --seed "$seed" --scale sample --out "/tmp/a-seed$seed"
            python /tmp/organizer/reference/a_ingest.py --data "/tmp/a-seed$seed" --out /tmp/a-ref
            SD_DATA_DIR="/tmp/a-seed$seed" SD_OUT_DIR=/tmp/a-out ./solution
            cmp /tmp/a-out/summary.txt /tmp/a-ref/summary.txt
          done
      - name: Reordered inputs and ASan/UBSan
        shell: bash
        run: |
          set -euo pipefail
          python tests/disorder.py "$PWD/solution" /tmp/organizer
          g++ -O1 -g -fsanitize=address,undefined -march=x86-64-v3 -std=c++20 -pthread -o /tmp/solution-asan track-a/main.cpp
          for scale in tiny sample; do
            SD_THREADS=6 SD_DATA_DIR="/tmp/a-$scale" SD_OUT_DIR=/tmp/a-out /tmp/solution-asan
            sha256sum /tmp/a-out/summary.txt
          done
          python tests/identity.py /tmp/solution-asan
      - name: ThreadSanitizer dictionary and output smoke
        shell: bash
        run: |
          set -euo pipefail
          g++ -O1 -g -fsanitize=thread -march=x86-64-v3 -std=c++20 -pthread -o /tmp/solution-tsan track-a/main.cpp
          for data in /tmp/a-tiny /tmp/a-seed2; do
            for threads in 6 12; do
              TSAN_OPTIONS=halt_on_error=1 SD_THREADS=$threads SD_DATA_DIR="$data" SD_OUT_DIR=/tmp/a-out /tmp/solution-tsan
            done
          done
          TSAN_OPTIONS=halt_on_error=1 python tests/identity.py /tmp/solution-tsan
      - name: Validate Docker allowlist and offline sandbox
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/organizer/harness/dockerfile_check.py track-a/Dockerfile /tmp/organizer/harness/allowlist.json
          docker pull gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce
          docker pull debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          docker build --network=none --pull=false -t sd-track-a -f track-a/Dockerfile track-a
          size=$(docker image inspect sd-track-a --format '{{.Size}}')
          test "$size" -lt 2000000000
          mkdir -p /tmp/a-container-out
          chmod 777 /tmp/a-container-out
          docker run --rm --network=none --read-only --memory=8g --memory-swap=8g --pids-limit=512 --tmpfs /tmp:rw,size=1g \
            --mount type=bind,source=/tmp/a-tiny,target=/data,readonly \
            --mount type=bind,source=/tmp/a-container-out,target=/out \
            sd-track-a
          echo 'c24fa507c963eaeac9224fd8435019b4f4e8c002ece7e32f316681a3957eb92f  /tmp/a-container-out/summary.txt' | sha256sum -c -
          docker run --rm --network=none --read-only --memory=8g --memory-swap=8g --pids-limit=512 --tmpfs /tmp:rw,size=1g \
            --mount type=bind,source=/tmp/a-full,target=/data,readonly \
            --mount type=bind,source=/tmp/a-container-out,target=/out \
            sd-track-a
          echo '495ca09682b9673ef836a506496177680bb4a3af54255174befddb1f83481cd3  /tmp/a-container-out/summary.txt' | sha256sum -c -

      - name: Matched pinned-toolchain axes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 4aa987898640222750cd5ee68500c3f3b9967375
          mkdir -p /tmp/champion-context
          git show FETCH_HEAD:track-a/main.cpp > /tmp/champion-context/main.cpp
          cp track-a/Dockerfile /tmp/champion-context/Dockerfile
          docker build --network=none --pull=false -t sd-champion /tmp/champion-context
          for pair in sd-champion:champion sd-track-a:candidate; do
            image=${pair%:*}
            label=${pair#*:}
            cid=$(docker create "$image")
            docker cp "$cid:/solution" "/tmp/$label"
            docker rm "$cid"
          done
          python tests/prize_compare.py --work /tmp/prize --organizer /tmp/organizer --champion /tmp/champion --candidate /tmp/candidate --docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prize-receipts
          path: /tmp/prize/*.json
